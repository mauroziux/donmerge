name: Deploy

on:
  push:
    branches: [main]

# Required GitHub configuration:
#   Secret:  CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   Variable: WORKER_BASE_URL      — Full base URL of the deployed worker
#            e.g. https://tableo-assitant-worker.my-account.workers.dev

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify review memory schema
        run: |
          set -o pipefail
          npx wrangler d1 execute donmerge-db --remote --json --command "SELECT (SELECT count(*) FROM d1_migrations WHERE name = '0009_link_legacy_review_memory.sql') AS migration_applied, (SELECT count(*) FROM sqlite_master WHERE type = 'table' AND name = 'legacy_learning_links') AS links_table, (SELECT count(*) FROM d1_migrations WHERE name = '0010_reaction_feedback_poll.sql') AS reaction_migration_applied, (SELECT count(*) FROM sqlite_master WHERE type = 'table' AND name = 'reaction_poll_targets') AS reaction_targets_table, (SELECT count(*) FROM sqlite_master WHERE type = 'trigger' AND name = 'reaction_poll_target_after_outcome') AS reaction_trigger" | node scripts/check-review-memory-schema.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Extend Wrangler version readback retry
        run: node scripts/extend-wrangler-readback.mjs
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: error

  verify:
    name: Post-deploy verification
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: bash scripts/verify-deploy.sh "${{ vars.WORKER_BASE_URL }}"
