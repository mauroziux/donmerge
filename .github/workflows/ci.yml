name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  model-sync-check:
    name: Model sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify wrangler model defaults match code
        run: |
          WRANGLER_PRIMARY=$(sed -nE 's/.*"CODEX_MODEL"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' wrangler.jsonc | head -1)
          WRANGLER_FALLBACK=$(sed -nE 's/.*"FALLBACK_MODEL"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' wrangler.jsonc | head -1)
          DEFAULT_PRIMARY=$(sed -nE "s/.*DEFAULT_PRIMARY_MODEL = '([^']+)'.*/\1/p" src/lib/llm-providers.ts | head -1)
          DEFAULT_FALLBACK=$(sed -nE "s/.*DEFAULT_FALLBACK_MODEL = '([^']+)'.*/\1/p" src/lib/llm-providers.ts | head -1)

          if [ -z "$WRANGLER_PRIMARY" ] || [ -z "$WRANGLER_FALLBACK" ] || [ -z "$DEFAULT_PRIMARY" ] || [ -z "$DEFAULT_FALLBACK" ]; then
            echo "FAIL: Could not extract model defaults from wrangler.jsonc or src/lib/llm-providers.ts" >&2
            exit 1
          fi

          echo "wrangler primary : $WRANGLER_PRIMARY"
          echo "code default     : $DEFAULT_PRIMARY"
          echo "wrangler fallback: $WRANGLER_FALLBACK"
          echo "code fallback    : $DEFAULT_FALLBACK"

          if [ "$WRANGLER_PRIMARY" != "$DEFAULT_PRIMARY" ] || [ "$WRANGLER_FALLBACK" != "$DEFAULT_FALLBACK" ]; then
            echo "FAIL: wrangler model configuration does not match code defaults" >&2
            exit 1
          fi

          echo "PASS: Model defaults are in sync."
